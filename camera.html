<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stash Camera</title>
  <link rel="stylesheet" href="camera.css">
</head>
<body>
  <div id="cam-app">
    <div class="cam-head">
      <span class="cam-brand">
        <span class="cam-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" fill="url(#stashGcam)"/><circle cx="12" cy="12" r="4.4" fill="#fff"/><defs><linearGradient id="stashGcam" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#6E56F0"/><stop offset="1" stop-color="#5B6EF5"/></linearGradient></defs></svg>
        </span>
        <span class="cam-brand-name">Stash</span>
        <span class="cam-brand-tag">Camera</span>
      </span>
    </div>
    <div class="cam-stage">
      <video id="cam-video" autoplay muted playsinline></video>
      <div id="cam-badge" class="cam-badge hidden"><span class="cam-dot"></span><span id="cam-badge-lbl">REC</span></div>
      <button id="cam-close" class="cam-close" aria-label="Close" title="Close">✕</button>
    </div>

    <div class="cam-bar">
      <div id="cam-status" class="cam-status">Requesting camera…</div>
      <div class="cam-controls">
        <button id="cam-pause" class="cam-ctrl hidden" aria-label="Pause" title="Pause">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="cam-record" class="cam-record" aria-label="Start recording" disabled>
          <span class="cam-record-dot"></span>
        </button>
        <div id="cam-timer" class="cam-timer">00:00</div>
      </div>
    </div>
  </div>
  <script src="db.js"></script>
  <script src="camera.js"></script>
</body>
</html>
